events:
- {on: q, sources: [lifecycle], action: estop}
modules:
- id: telemetry
  type: omega_real.transports.zmq.ZmqReceiver
  rate_hz: 100
  options:
    endpoint: ${TELEMETRY_ENDPOINT}
    topic: g1_debug
    format: sonic_telemetry
- id: camera
  type: omega_real.sensors.camera.JpegZmqCamera
  rate_hz: 30
  outputs:
    rgb: camera.rgb
  options:
    endpoint: tcp://${CAMERA_HOST}:5555
    service:
      host: ${CAMERA_HOST}
      port: 13579
    crop:
    - 0
    - 0
    - 640
    - 360
- id: lifecycle
  type: omega_real.policies.lifecycle.Lifecycle
  rate_hz: 50
  outputs:
    command.start: lifecycle.command.start
    command.stop: lifecycle.command.stop
    command.planner: lifecycle.command.planner
    enabled: lifecycle.enabled
  options:
    planner_seconds: 2.5
- id: model
  type: omega_real.models.omega.OmegaInferenceClient
  events:
  - {on: started, sources: [lifecycle], action: restart}
  - {on: p, sources: [lifecycle], action: model_toggle_pause}
  rate_hz: 100
  inputs:
    image: camera.rgb
    state.joint_pos: g1_debug.body_q
    state.base_quat: g1_debug.base_quat
    state.left_hand: g1_debug.left_hand_q
    state.right_hand: g1_debug.right_hand_q
    enabled: lifecycle.enabled
  outputs:
    chunk.action: model.chunk.action
    reference.action: model.reference.action
    command.token_state: model.command.token_state
    command.frame_index: model.command.frame_index
    command.left_trigger: model.command.left_trigger
    command.right_trigger: model.command.right_trigger
  options:
    endpoint: ${INFERENCE_ENDPOINT}
    # gear_sonic_deploy Inspire hand telemetry is already in normalized actuator units.
    hand_state_scale: 1.0
    view: ego
    inference_interval: 8
    inference_delay: 8
    observation:
      anchor: image
      max_age_ms: 200
      instruction: ${INSTRUCTION}
    scheduling: rtc
    overlap: 9
    max_response_age_ms: 5000
    timeout_seconds: 5
- id: sonic
  type: omega_real.policies.sonic.SonicCommandAdapter
  rate_hz: 100
  inputs:
    command.left_trigger: model.command.left_trigger
    command.right_trigger: model.command.right_trigger
  outputs:
    command.left_hand_joints: command.wire.left_hand_joints
    command.right_hand_joints: command.wire.right_hand_joints
  options:
    hands:
      left:
        open: [1., 1., 1., 1., 1., 1.]
        closed: [0., 0., 0., 0., 0., 0.]
        fixed: {"5": 0.0}
      right:
        open: [1., 1., 1., 1., 1., 1.]
        closed: [0., 0., 0., 0., 0., 0.]
        fixed: {"5": 0.0}
- id: sender
  type: omega_real.transports.zmq.ZmqSender
  inputs:
    pose.token_state: model.command.token_state
    pose.frame_index: model.command.frame_index
    pose.left_hand_joints: command.wire.left_hand_joints
    pose.right_hand_joints: command.wire.right_hand_joints
    command.start: lifecycle.command.start
    command.stop: lifecycle.command.stop
    command.planner: lifecycle.command.planner
  options:
    endpoint: ${COMMAND_ENDPOINT}
    bind: true
    format: sonic_json
    topics:
      pose:
        version: 4
      command:
        version: 1
  rate_hz: 100
  outputs:
    sent.pose.token_state: command.sent.token_state
    sent.pose.frame_index: command.sent.frame_index
    sent.pose.left_hand_joints: command.sent.left_hand_joints
    sent.pose.right_hand_joints: command.sent.right_hand_joints
